frontier_explorer:
  ros__parameters:
    # Start with dry_run: true. The robot will NOT move; frontiers just appear
    # in RViz (/exploration/frontiers) while you drive with the controller.
    # Set to false only when SLAM + Nav2 work together and lite3_auto is on.
    dry_run: true

    global_frame: map
    odom_frame: odom
    robot_frame: base_link
    # Check the two TF links independently and use the composed map pose for goals.
    # 25/11: back to the code defaults (were raised to 7.5 / 15 at 09:55). A 7.5 s old pose
    # is metres off while walking; stale odometry is fixed at its source (no depth cloud
    # over the robot link, FAST-LIO max_lidar_backlog), not by trusting older poses.
    pose_max_age_s: 2.5
    slam_max_age_s: 5.0
    pose_settle_s: 3.0             # healthy TF plus at least two distinct odometry samples
    pose_result_wait_s: 3.0        # allow a newer map pose to confirm Nav2 success
    pose_goal_tolerance_m: 0.35
    pose_goal_cooldown_s: 15.0     # defer after an inconclusive retry
    cmd_vel_topic: /nav_cmd_vel  # twist_mux input, so the joystick (priority 100) can override
    tick_hz: 5.0

    # Starting gait (issue 4): a NAME from config/gait.yaml, asked from the gait owner
    # (special_obstacles) on /gait/request; it sends the code and confirms on /gait/current.
    # Codes are written only in config/gait.yaml. '' = keep the current gait.
    start_gait: flat

    # Opening 360 deg scan (skipped in dry run)
    initial_spin: true       # look-around for the CAMERA; done by Nav2 spin (stops before hitting walls)
    spin_speed: 0.5          # rad/s
    spin_turns: 1.0

    # Frontier detection
    min_frontier_size_cells: 5   # ignore tiny gaps (5 cells at 5 cm = 25 cm)
    free_max: 25                 # grid value <= this counts as free
    occupied_min: 65             # grid value >= this counts as wall
    goal_clearance_m: 0.30       # goal must be this far from walls (robot is 0.61 x 0.37 m; 0.40 dropped frontiers in ~1 m corridors)

    # score = w_size * length_m - w_dist * distance_m + w_bias * bias
    w_size: 1.0
    w_dist: 1.0
    w_bias: 3.0

    # Never get stuck
    time_limit_base_s: 20.0      # limit = base + per_m * distance
    time_limit_per_m_s: 8.0
    progress_window_s: 10.0      # must get min_progress_m closer in this time
    min_progress_m: 0.3
    recheck_period_s: 2.0
    blacklist_radius_m: 0.6
    backup_speed: 0.15           # m/s, recovery back-up
    backup_time_s: 0.0           # 0 = no blind reversing (nothing checks for walls behind)
    max_consecutive_failures: 3
    done_after_empty_checks: 50  # 50 empty checks at 5 Hz = 10 s with no frontiers (2 s ended runs early)

    # Arena box in the MAP frame [xmin, ymin, xmax, ymax] (+ ~0.3 m margin); frontiers outside
    # are ignored. Map origin = start pose, +x = start forward, +y = left. [0.0] = off.
    # MEASURE on the day (layout changes on 27 Nov). Write decimals: [-0.6, -3.4, 5.5, 0.6]
    bounds: [0.0]
    # Large-map guard (used only while bounds is off): frontiers AND camera coverage limited to
    # +/- guard_radius_m around the start pose, so COVER doesn't chase the lab outside the
    # arena or ghost walls after a SLAM jump. 6 m covers a ~5 x 5-cell maze from any corner.
    # Set it to the maze size + ~1 m. 0 = off (unbounded, old behaviour).
    guard_radius_m: 6.0

    # Look-around after reaching a goal >= goal_spin_min_gap_m from the last one, so the
    # camera sees side walls (QR codes). 360 deg at 0.5 rad/s ~ 13 s; 180 if time is tight.
    goal_spin_deg: 360.0
    goal_spin_min_gap_m: 2.0

    # ---- Camera coverage (COVER state, coverage.py) ----
    # "Mapped" is not "explored": SLAM maps a room from the doorway, but QR codes are on the
    # side walls and only the forward camera reads them. When no frontiers are left, the
    # explorer drives to free cells the camera has not looked at yet. DONE (and
    # /exploration/done) only when coverage_target is reached or no coverage goal is
    # reachable for done_after_empty_checks ticks. false = old behaviour (DONE on no frontiers).
    # Coverage only counts cells inside `bounds` above. bounds off ([0.0]) = every mapped free
    # cell counts (also the lab outside the arena), so it may keep going: stop it by hand.
    coverage_enabled: true
    coverage_target: 0.95            # share of free cells (inside bounds) the camera must see
    camera_fov_deg: 70.0             # forward camera horizontal field of view
    camera_range_m: 1.3              # distance at which a QR code is still readable. 24/11: was 2.5,
                                     # but a 10-15 cm QR on the 640x480 camera reads only up to
                                     # ~1.2 m (qr_reader tests) -> walls counted as 'seen' from 2.5 m
                                     # were never readable. 1.3 m makes coverage drive close to them.
    robot_radius_m: 0.35             # cells the robot stood on also count as seen
    coverage_min_cluster_cells: 10   # ignore unseen patches smaller than this (10 x 5 cm cells)
    coverage_save_period_s: 10.0     # pose history saved this often (and on shutdown)
    coverage_file: ""                # "" = ~/challenge_ws/coverage/coverage_<YYYYmmdd_HHMMSS>.npz
    resume_coverage: false           # true = load coverage_file (or the newest file) at start.
                                     # ONLY if SLAM keeps the same map frame (same saved map /
                                     # same start pose), otherwise the old poses are in the wrong place.

    # ---- ROOM check (cells.py) ----
    # Booklet E6: QR codes are only on the LEFT/RIGHT walls of rooms, 10-15 cm (readable up to
    # ~1.2 m). A room = a free 1.02 m cell with three walls on the LIVE map (no pre-mapping).
    # room_check: go to its doorway, face into the room, then each side wall, room_dwell_s
    # each (QR reader + wall pins read the code, VLM gets one photo per view). Nearby rooms
    # (room_check_radius_m) before frontiers; every remaining room before camera coverage.
    # Launch switch: room_check:=true. /exploration/cells (RViz) shows cells, walls, rooms.
    room_check: false
    room_check_radius_m: 3.0
    room_dwell_s: 2.5
    room_max_attempts: 2
    cell_overlay: true

    # ---- GRID explore ----
    # Confirm one neighbouring cell at a time along a route to a reachable unvisited cell.
    # Frontiers uncover cells that are still unknown. Everything (cells,
    # frontiers, coverage) stays inside grid_bounds_cells: arena cells relative to the start
    # cell, [i_min, j_min, i_max, j_max], +i = start forward, +j = start left.
    # Default: 5 rows + final cell forward (0..5), 2 cells each side (mirrored arenas: the
    # 2 columns outside the real arena are behind its outer wall and simply never reachable).
    # Launch switch: grid_explore:=true.
    grid_explore: false
    grid_bounds_cells: [0, -2, 5, 2]
    grid_max_attempts: 2
    cell_visit_edge_margin_m: 0.10  # avoid counting poses right on the cell boundary

    # ---- HOLD: stand still so obstacle_detector can confirm (gait change) ----
    # The detector needs confirm_frames frames in a row (obstacle.yaml: 3 at rate_hz 2 =
    # 1.5 s, more if YOLO runs slower) before it sends stairs/rubble/curtain/potholes_ahead.
    # goal_dwell_s must be > confirm_frames / rate_hz + ~1 s. 0 = off.
    goal_dwell_s: 2.5                # after reaching a frontier / coverage goal, facing travel direction
    obstacle_hold_s: 4.0             # Nav2 failed / timed out / no progress AND an obstacle is ahead:
                                     # hold instead of blacklisting + recovery (once per goal)
    obstacle_hold_m: 1.5             # detection with 0 < forward_m <= this and |left_m| <= 0.5 (or trigger)
    obstacle_recent_s: 2.0           # ... that arrived within this many seconds

    # ---- ENTER the cell behind a frontier (issue 1, 26/11) ----
    # The 360 deg lidar maps the room behind a doorway from metres away, so "frontier mapped
    # -> cancel" turned the robot away before it walked in and the camera never saw the
    # room's side walls. Now a frontier goal is done only when the robot is INSIDE the cell
    # the frontier leads into (or the camera saw that cell); a mapped frontier becomes
    # "go into that cell". false = old behaviour (cancel as soon as it is mapped).
    frontier_enter_cell: true
    frontier_seen_done_frac: 0.9     # share (0-1) of the target cell's free floor the camera saw
                                     # = done without driving in (0.9: a whole room look, not a glance)
    frontier_lead_m: 0.5             # m past the frontier = the cell it leads into (half a 1.02 m cell)
    # Position-jump latch (pose_health.py). 25/11 one FAST-LIO hiccup ('odom -> base_link
    # jumped 1.30 m in 0.70 s') latched forever and the explorer sat in WAIT_POSE. Now it
    # clears after pose_jump_recover_s seconds of stable, jump-free TF. 0 = old permanent latch.
    pose_jump_recover_s: 10.0        # s; > slam_toolbox map_update_interval (2 s) x a few updates
    pose_jump_hard_m: 5.0            # m; bigger jumps (20/11: tens of metres) never clear: restart
    idle_warn_period_s: 5.0          # s between "Explorer not moving: state=..., reason: ..." WARNs

    # ---- Frontier record + final retry (issue 2) ----
    # Every chosen frontier is kept in coverage_<time>.frontiers.json next to the coverage
    # file (pending / explored / failed + reason), shown in /exploration/cells namespace
    # frontier_status (explored green, failed red, pending blue) and restored with
    # resume_coverage. Before COVER / DONE each failed or pending frontier is retried ONCE.
    frontier_retry_enabled: true
    frontier_retry_delay_s: 20.0     # s after its last failure (costmap clears, robot is elsewhere
                                     # = a different approach direction)
    # ---- Walls in /exploration/cells (issue 2) ----
    wall_seen_frac: 0.5              # share (0-1) of a wall's length the camera saw (within
                                     # camera_range_m) -> wall drawn blue (checked)
    keep_visited_walls: true         # walls of visited cells stay drawn when a later map
                                     # update makes the cell 'partial'

    # ---- Noise outside the arena (issue 3) ----
    use_grid_bounds_box: false       # true = frontiers/coverage only inside grid_bounds_cells
                                     # (+0.3 m) even without grid_explore. Spectators seen above
                                     # the 0.54 m walls then no longer create frontiers.

    # ---- Room look waits for the VLM (issue 5) ----
    room_look_wait_done: true        # each view waits for /perception/look_done (VLM answer)
    room_look_timeout_s: 15.0        # s; then the next view anyway (scene server ~3-10 s, 30 s
                                     # timeout in vlm_watcher would stall a room check too long)
    room_max_relooks: 1              # extra look when the answer was for a photo taken before
                                     # the look (vlm_watcher was busy with a background ask)

    # ---- No back-up right after a crossing (issue 8) ----
    no_backup_after_crossing_s: 30.0 # s after /special/report: no RECOVER back-up, and Nav2 goals use
                                     # config/bt/*_no_backup.xml (default tree minus BackUp 0.30 m)
    no_backup_bt_dir: ""             # "" = installed share/lite3_explore_pose/config/bt

    # ---- Cell-centre routing (issue 10) ----
    # Grid steps use one NavigateToPose per cell, with a centring goal first if needed.
    # Other routed goals use the cell graph (BFS over open sides) to send doorway midpoints
    # and cell centres in one NavigateThroughPoses goal when a grid route is available.
    cell_routing: true
    route_kinds: ['cell', 'frontier', 'room', 'coverage']
    centre_tolerance_m: 0.15         # m from the cell centre before leaving it (~ Nav2 goal 0.25)
    centre_heading_deg: 15.0         # deg off the doorway direction -> turn at the centre first
    # Grid alignment check (report only, WARN). Cell centres come from mission.yaml
    # start_cell_centre / start_heading_deg = the start pose: not centred / not square = every
    # 'centre' is off.
    grid_check_period_s: 30.0        # s between checks (only after a map update)
    grid_check_offset_m: 0.05        # m walls vs expected cell borders -> WARN
    grid_check_rot_deg: 3.0          # deg walls vs grid -> WARN
    grid_check_min_strength: 0.2     # 0..1; below = too little wall on the map to judge
