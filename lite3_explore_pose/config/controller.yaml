# mission_controller settings (loaded by the launch files; mission_file is set there).
mission_controller:
  ros__parameters:
    # ---- Position jumps (issue 1, 26/11) ----
    # pose_jump_m: more than this between two 0.2 s ticks = a jump (1.0 fired on a normal
    # 1.0 m SLAM correction, 20/11). Old behaviour: every jump ended the run (DONE); the
    # 25/11 logs show 3.0-8.5 m jumps ending 20+ runs. Now jumps up to pose_jump_hard_m
    # pause the robot in LOCALIZE until localization is ready and jump-free for
    # pose_jump_recover_s, then exploring continues. pose_jump_recover_s 0 = old (DONE).
    pose_jump_m: 3.0                 # m per 0.2 s tick
    pose_jump_hard_m: 8.0            # m; above this (20/11: tens of metres) = broken: DONE
    pose_jump_recover_s: 10.0        # s of stable pose before moving again

    # ---- Stop and look (issue 5) ----
    scene_investigate: true          # scene answer (/perception/room != unknown) in a cell not
                                     # investigated yet -> INVESTIGATE (robot stops, looks)
    investigate_settle_s: 1.0        # s standing still before /perception/look (sharp photo)
    max_relooks: 1                   # one more look if the answered photo predates the look
    stale_margin_s: 0.3              # s; photo time = look_done - latency_s, compared with the
                                     # time the look was sent minus this margin
    look_cell_cooldown_s: 60.0       # s; no second stop-and-look in the same arena cell
    qr_wait_place: true              # QR look: stay stopped until qr_reader has sent the code
                                     # (placed, or out of place_attempts); investigate_timeout_s caps it
    investigate_timeout_s: 20.0      # s; existing default, written here so it is visible: a dead
                                     # desktop / link never keeps the robot waiting longer

    # ---- Curtain (issue 7) ----
    # The lidar maps the curtain as a wall: the explorer never plans through it, so the
    # curtain is approached on purpose from a sighting. 22/11: YOLO 'curtains' near the start
    # sent the robot back 3x ('not confirmed up close'): curtain needs more sightings, the
    # close-up check (curtain_trigger_m + wrinkle) still decides the crossing, and an
    # approach gives up after approach_wait_s (then never again for that spot).
    approach_kinds: ['rubble', 'curtain']
    approach_wait_s: 6.0             # s at the spot waiting for the close-range trigger (existing)
    curtain_min_sightings: 4         # sightings (2 Hz detector) before driving to a curtain
    curtain_standoff_m: 0.5          # m before the curtain, facing the doorway squarely
    # After crossing, the curtain stays a wall on the map. It is recorded as a passable
    # curtain (/exploration/portal_crossed): the explorer forgets earlier failures behind it.
    # No Nav2 / costmap change (see README: costmap option needs your OK).
    portal_return: true              # this side done -> approach the curtain again and cross back
    portal_max_crossings: 3          # in + out + one more at most
