# Competition-day settings, read by vlm_watcher, qr_reader, reporter and mission_controller.
# Everything marked TODO must be filled in from the organisers' lists before the run.

group_id: group05                 # plain group ID for now (works with the scene server, as in Lab 6).
                                  # LATER, before competition day: change to the registered group05_XXXX.

scene_server: http://192.168.10.141:8000/analyze
report_server: http://192.168.10.141:8001/task_report
send_reports: false               # false = only log what WOULD be sent. true on competition day.

# ---- Arena coordinates (used for the "pos" field = centre of the arena cell) ----
# Our SLAM map starts where the robot starts (map origin = start pose, x = robot forward).
# Give the start cell centre and the robot's start heading in ARENA coordinates.
arena:
  cell_size_m: 1.0                # TODO: grid cell size
  start_cell_centre: [0.5, 0.5]   # TODO: arena (x, y) of the start cell centre
  start_heading_deg: 0.0          # TODO: robot heading at start, in arena frame (0 = +x)
  final_cell_centre: [5.5, 0.5]   # TODO: arena (x, y) of the final cell (end of ground run)

# ---- Predefined answer lists (TODO: replace with the organisers' lists) ----
scene_types: [clinic, kitchen, office, storage, control_room, corridor, unknown]
hazard_labels: [radioactive, electrical, general_warning, magnetic_field, non_ionizing_radiation,
                biohazard, laser, flood, optical_radiation, chemical]
object_labels: [medical_kit, fire_extinguisher, food_supplies, water, first_aid_box]

# task_id for each report. Key "task_type" or "task_type:label". TODO: organisers' mission IDs.
# Anything not listed gets an automatic id: survivor -> S01, S02 ..., hazard -> H01, object -> O01, qr -> Q01
task_ids: {}

# Stop exploring and head for the final cell when this much time is used (seconds).
time_limit_s: 900                 # TODO: real run time limit
exit_margin_s: 120                # leave this much time to reach the final cell

# Expected number of each task; when all are reported -> /mission/tasks_done (leave early).
# 0 = unknown (never counts as done).
expected_counts: {survivor: 0, hazard: 0, object: 0, qr: 0}
